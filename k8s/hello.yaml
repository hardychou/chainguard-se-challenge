apiVersion: v1
kind: Namespace
metadata:
  name: hello
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello
  namespace: hello
  labels: { app: hello }
spec:
  replicas: 2
  selector:
    matchLabels: { app: hello }
  template:
    metadata:
      labels: { app: hello }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
      - name: hello
        image: IMAGE_REF
        ports:
        - containerPort: 8080
        env:
        - { name: GIN_MODE, value: release }
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: { drop: ["ALL"] }
        resources:
          requests: { cpu: 50m, memory: 32Mi }
          limits: { memory: 64Mi }
        readinessProbe:
          httpGet: { path: /, port: 8080 }
          periodSeconds: 5
        livenessProbe:
          httpGet: { path: /, port: 8080 }
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: hello
  namespace: hello
spec:
  selector: { app: hello }
  ports:
  - port: 80
    targetPort: 8080
